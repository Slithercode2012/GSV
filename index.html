<div id="modal">
  <div class="modal-nav">
    <span id="activeGame" class="font-bold text-purple-400"></span>
    <span id="iframeMsg" style="color:#ddd; font-size:13px; margin:0 12px;"></span>
    <div class="flex gap-6">
      <i class="fas fa-expand cursor-pointer hover:text-purple-400" onclick="document.querySelector('iframe').requestFullscreen()"></i>
      <i class="fas fa-times cursor-pointer text-red-500 text-2xl" onclick="closeGame()"></i>
    </div>
  </div>
  <iframe id="gameFrame" src="about:blank" title="Game preview"></iframe>
</div>
