<!DOCTYPE html>
<!-- Generated standalone GSV file (embedded games snapshot) -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>GSV | Good Server Variable (Standalone)</title>
    <style>
        :root { 
            --primary: #9d4edd; 
            --bg: #0b0e14; 
            --card: rgba(22, 27, 34, 0.8); 
        }
        body { 
            background-color: var(--bg); color: white; font-family: 'Inter', sans-serif;
            margin: 0; min-height: 100vh; overflow-x: hidden;
        }

        /* Pulsing Pigeon */
        .pigeon {
            font-size: 40px; display: inline-block;
            animation: pulse 1.5s infinite ease-in-out;
            filter: drop-shadow(0 0 8px var(--primary));
            cursor: pointer;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 15px var(--primary)); }
        }

        /* Header Island */
        .island-header {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 99px;
            padding: 10px 25px; display: flex; align-items: center; gap: 15px;
            margin: 30px auto; width: fit-content; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Game Grid */
        .game-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px; padding: 20px 40px; max-width: 1400px; margin: 0 auto;
        }
        .card {
            background: var(--card); border-radius: 12px; overflow: hidden;
            border: 2px solid transparent; transition: 0.3s ease; cursor: pointer;
            aspect-ratio: 1/1; position: relative; text-decoration: none; color: inherit;
        }
        .card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .card img { width: 100%; height: 100%; object-fit: cover; display:block; }
        .card-title {
            position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85);
            padding: 8px 4px; text-align: center; font-size: 11px; font-weight: bold;
        }
        .play-badge{ position:absolute; left:8px; top:8px; }
        .play-badge .circle{ width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center}
        .card-label{ position:absolute; bottom:6px; left:8px; right:8px; text-align:center; font-size:12px}

        /* Modal Area */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 9999; }
        .modal-nav { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; background: #111; border-bottom: 1px solid var(--primary); }
        iframe { width: 100%; height: calc(100vh - 60px); border: none; }

        /* Protection Panel Elements */
        .gate-body {
            display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center;
        }
        .panel-container { padding: 30px; max-width: 650px; width: 100%; }
        .headline { font-size: 26px; font-weight: bold; color: #ffffff; margin: 0; display: inline-flex; align-items: center; justify-content: center; gap: 12px; line-height: 1.4; }
        .mascot { font-size: 32px; user-select: none; display: inline-block; cursor: pointer; transition: transform 0.1s ease; }
        .mascot:active { transform: scale(0.9); }
        .subtext { margin-top: 14px; font-size: 14px; color: #a78bfa; opacity: 0.8; font-family: monospace; }
        .password-box { margin-top: 24px; padding: 12px 16px; width: 280px; background-color: #161b26; border: 2px solid #2d3748; border-radius: 8px; color: #ffffff; font-size: 16px; text-align: center; outline: none; transition: border-color 0.2s; }
        .password-box:focus { border-color: #a78bfa; }
        .submit-btn { display: block; margin: 16px auto 0 auto; padding: 10px 24px; background-color: #6d28d9; color: #ffffff; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .submit-btn:hover { background-color: #7c3aed; }

        /* small helpers */
        .col-span-full { grid-column: 1 / -1; }
        .text-center{ text-align:center }
    </style>
</head>

        try{
            const jsonText = atob(embeddedGamesBase64.replace(/\s+/g,''));

        // --- AUTH & LOCKOUT SYSTEM VARIABLES ---
        let clickCounter = 0;
        let secretPattern = [];
        
        const requiredClicks = 10;
        const validKeys = ["noor stop playing games", "owner"];
        
        const authKey = "gsv_authorized";
        const lockTimeKey = "gsv_lockout_time";
        const ownerFlagKey = "gsv_is_owner";

        const repoOwner = "hazzatazza";
        const repoName = "algebruh-practise";
        const cdnBase = `https://cdn.jsdelivr.net/gh/${repoOwner}/${repoName}@main/`;
        let allGames = [];

        // Run gate controller check on page load
        checkSystemState();

        function checkSystemState() {
            if (sessionStorage.getItem(authKey) === "true") {
                unlockHub();
                return;
            }

            const lockoutTimestamp = localStorage.getItem(lockTimeKey);
            if (lockoutTimestamp) {
                const currentTime = Date.now();
                const minutesRemaining = (parseInt(lockoutTimestamp) - currentTime) / 60000;

                if (minutesRemaining > 0) {
                    showHardBlockPage();
                    return;
                } else {
                    localStorage.removeItem(lockTimeKey);
                }
            }

            showMaintenancePage();
        }

        // --- PAGE 1: MAINTENANCE SCREEN ---

            clickCounter = 0;
            secretPattern = []; 
            const panel = document.getElementById('displayPanel');
            
            const isOwner = localStorage.getItem(ownerFlagKey) === "true";

                    <span class="mascot" id="birdBtn">🐦</span>
                </h1>

            if (comboString === "text-bird-text-text") {

                showMaintenancePage();
            }
        }

            const panel = document.getElementById('displayPanel');
            panel.innerHTML = `

            document.getElementById('submitBtn').addEventListener('click', verifyInput);

                if (e.key === 'Enter') verifyInput();
            });

            clickCounter = 0;

            clickCounter = 0;

            bindBirdClick(() => {
                localStorage.removeItem(lockTimeKey);

            });

        // --- SYSTEM GATE HELPER CODES ---
        function bindBirdClick(successCallback) {
            document.getElementById('birdBtn').addEventListener('click', () => {
                clickCounter++;
                if (clickCounter === requiredClicks) {
                    clickCounter = 0;
                    successCallback();
                }
            });
        }

        function verifyInput() {
            const inputVal = document.getElementById('passInput').value;

            if (validKeys.includes(inputVal)) {
                sessionStorage.setItem(authKey, "true");
                unlockHub();
            } else {
                const tenMinutesInFuture = Date.now() + (10 * 60 * 1000); 
                localStorage.setItem(lockTimeKey, tenMinutesInFuture.toString());
                showAccessDeniedPage();
            }
        }

        function unlockHub() {
            // Drop the security wall containers completely
            document.getElementById('gateWrapper').style.display = 'none';
            
            // Un-hide the genuine grid layout block
            document.getElementById('mainSiteWrapper').style.display = 'block';
            
            // Fire your database connector to load games
            initGSV();
        }

        // --- PRIMARY APP FUNCTION LOGIC (uses embeddedGames) ---
        function initGSV() {
            try {
                // Map embeddedGames into the layout shape used by render()
                allGames = embeddedGames.map(g => ({ title: g.title || g.id, url: g.url || '', thumb: g.thumb || null }));
                if(document.getElementById('loading')) {
                    document.getElementById('loading').remove();
                }
                render(allGames);
            } catch (err) {
                console.error("GSV Error:", err);
                if(document.getElementById('loading')) {
                    document.getElementById('loading').innerText = "Failed to load modules.";
                }
            }
        }

        function render(gamesList) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';

            gamesList.forEach(game => {
                const card = document.createElement('a');
                card.className = 'card';
                card.onclick = (e) => { e.preventDefault(); openGame(game.url || (game.id ? (cdnBase + (game.thumb || '')) : ''), game.title); };

                const thumbUrl = game.thumb ? (cdnBase + game.thumb) : 'https://via.placeholder.com/300x300?text=Module';

                card.innerHTML = `
                    <img src="${thumbUrl}" loading="lazy" onerror="this.src='https://placehold.co/300x300/101820/f5f7ff?text=Module'">
                    <div class="card-title">${escapeHtml(game.title)}</div>
                `;
                grid.appendChild(card);
            });
        }

        function openGame(url, title) {
            document.getElementById('activeGame').innerText = title;
            document.getElementById('gameFrame').src = url;
            document.getElementById('modal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('gameFrame').src = '';
            document.body.style.overflow = 'auto';
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allGames.filter(g => g.title.toLowerCase().includes(term));
            render(filtered);
        });

        function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]; }); }
    </script>
